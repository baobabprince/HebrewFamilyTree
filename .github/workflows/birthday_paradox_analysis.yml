name: Birthday Paradox Analysis

on:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write Google token
        run: echo '${{ secrets.GOOGLE_TOKEN_JSON }}' > token.json

      - name: Write service credentials
        run: |
          echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=sa.json" >> $GITHUB_ENV

      - name: Download GEDCOM and analyze birthdays
        env:
          GOOGLE_APPLICATION_CREDENTIALS: sa.json
        run: |
          python3 << 'PY'
          import os, re, math, collections, statistics
          from datetime import date
          from family_tree_notifier.google_drive_utils import download_gedcom_from_drive
          from family_tree_notifier.gedcom_utils import fix_gedcom_format
          from family_tree_notifier.constants import GOOGLE_DRIVE_FILE_ID, INPUT_GEDCOM_FILE, FIXED_GEDCOM_FILE
          from gedcom.parser import Parser

          assert download_gedcom_from_drive(GOOGLE_DRIVE_FILE_ID, INPUT_GEDCOM_FILE)
          fix_gedcom_format(INPUT_GEDCOM_FILE, FIXED_GEDCOM_FILE)

          parser = Parser()
          parser.parse_file(FIXED_GEDCOM_FILE)

          # Collect birth month-day and full dates where possible
          # Also Hebrew birth dates from DATE lines if tagged @#DHEBREW@
          greg_md = []          # (month, day) for people with parseable gregorian birth
          greg_full = []        # (year, month, day)
          names_by_md = collections.defaultdict(list)
          all_individuals = 0
          with_any_birth = 0
          with_greg_md = 0
          with_year = 0

          MONTHS = {
              'JAN':1,'FEB':2,'MAR':3,'APR':4,'MAY':5,'JUN':6,
              'JUL':7,'AUG':8,'SEP':9,'OCT':10,'NOV':11,'DEC':12,
          }

          def parse_gedcom_date(val):
              if not val:
                  return None
              val = val.strip()
              # skip pure hebrew marker lines handled elsewhere
              if '@#DHEBREW@' in val.upper() or 'HEBREW' in val.upper():
                  return None
              # patterns: 15 MAR 1980, MAR 1980, 1980, ABT 15 MAR 1980, BEF ...
              val = re.sub(r'^(ABT|ABOUT|EST|CAL|BEF|AFT|FROM|TO|BET|AND)\s+', '', val, flags=re.I).strip()
              # DD MON YYYY
              m = re.search(r'(\d{1,2})\s+([A-Z]{3})\s+(\d{3,4})', val, re.I)
              if m:
                  day, mon, year = int(m.group(1)), MONTHS.get(m.group(2).upper()), int(m.group(3))
                  if mon and 1 <= day <= 31:
                      return (year, mon, day)
              # MON YYYY
              m = re.search(r'^([A-Z]{3})\s+(\d{3,4})$', val, re.I)
              if m:
                  return None  # no day
              # DD MON
              m = re.search(r'(\d{1,2})\s+([A-Z]{3})\s*$', val, re.I)
              if m:
                  day, mon = int(m.group(1)), MONTHS.get(m.group(2).upper())
                  if mon and 1 <= day <= 31:
                      return (None, mon, day)
              return None

          for ptr, el in parser.get_element_dictionary().items():
              if not ptr.startswith('@') or el.get_tag() != 'INDI':
                  continue
              all_individuals += 1
              name = None
              birth_date_val = None
              for child in el.get_child_elements():
                  if child.get_tag() == 'NAME':
                      name = child.get_value()
                  if child.get_tag() == 'BIRT':
                      for gc in child.get_child_elements():
                          if gc.get_tag() == 'DATE':
                              birth_date_val = gc.get_value()
              if not birth_date_val:
                  continue
              with_any_birth += 1
              parsed = parse_gedcom_date(birth_date_val)
              if not parsed:
                  continue
              year, mon, day = parsed
              if mon and day:
                  with_greg_md += 1
                  greg_md.append((mon, day))
                  display = name or ptr
                  names_by_md[(mon, day)].append(display)
                  if year:
                      with_year += 1
                      greg_full.append((year, mon, day))

          n = len(greg_md)
          print('=== DATA COVERAGE ===')
          print(f'Total individuals in GEDCOM: {all_individuals}')
          print(f'With any BIRT/DATE: {with_any_birth}')
          print(f'With parseable Gregorian month+day: {n}')
          print(f'With full year+month+day: {with_year}')

          # Classic birthday paradox: P(at least one shared birthday) among n people, 365 days
          def p_at_least_one_shared(n, d=365):
              if n > d:
                  return 1.0
              # 1 - P(all distinct) = 1 - d!/(d-n)! / d^n
              log_p_all_distinct = 0.0
              for i in range(n):
                  log_p_all_distinct += math.log(d - i) - math.log(d)
              return 1.0 - math.exp(log_p_all_distinct)

          # Expected number of people pairs that share a birthday
          def expected_shared_pairs(n, d=365):
              return math.comb(n, 2) / d if n >= 2 else 0.0

          # Expected number of occupied days that have k people (approx Poisson)
          def expected_collision_days(n, d=365):
              # E[number of days with at least 2] = d * (1 - e^{-λ} - λe^{-λ}) where λ=n/d
              lam = n / d
              return d * (1 - math.exp(-lam) * (1 + lam))

          counts = collections.Counter(greg_md)
          occupied = len(counts)
          multi = {k: v for k, v in counts.items() if v >= 2}
          max_share = max(counts.values()) if counts else 0
          shared_pairs = sum(math.comb(v, 2) for v in counts.values() if v >= 2)
          days_with_2plus = len(multi)
          days_with_3plus = sum(1 for v in counts.values() if v >= 3)
          days_with_4plus = sum(1 for v in counts.values() if v >= 4)

          print('\n=== CLASSIC BIRTHDAY PARADOX ===')
          print(f'n = {n} people with known month-day')
          print(f'P(at least one shared birthday | uniform 365) = {p_at_least_one_shared(n):.6f}')
          print(f'Observed: at least one shared birthday = {days_with_2plus > 0}')
          print(f'Expected number of shared pairs = {expected_shared_pairs(n):.2f}')
          print(f'Observed number of shared pairs = {shared_pairs}')
          print(f'Expected days with 2+ people = {expected_collision_days(n):.2f}')
          print(f'Observed days with 2+ people = {days_with_2plus}')
          print(f'Observed days with 3+ people = {days_with_3plus}')
          print(f'Observed days with 4+ people = {days_with_4plus}')
          print(f'Max people on one calendar day = {max_share}')

          # Chi-square uniformity test on 365 bins (ignore Feb 29 for fairness → 365)
          # Map (2,29) separately
          bins = [0] * 365
          feb29 = 0
          for mon, day in greg_md:
              if mon == 2 and day == 29:
                  feb29 += 1
                  continue
              # day-of-year index 0..364 excluding feb29
              md_to_doy = []
              # use a non-leap reference year 2001
              try:
                  doy = date(2001, mon, day).timetuple().tm_yday - 1  # 0..364
                  if 0 <= doy < 365:
                      bins[doy] += 1
              except ValueError:
                  pass
          n_non_leap = sum(bins)
          expected_per = n_non_leap / 365.0 if n_non_leap else 0
          chi2 = sum((b - expected_per) ** 2 / expected_per for b in bins) if expected_per else 0
          # df = 364, critical 0.05 ≈ 409.3, 0.01 ≈ 430 approx; use Wilson/normal approx for p
          # mean df=364, var=728; z = (chi2-364)/sqrt(728)
          z = (chi2 - 364) / math.sqrt(2 * 364) if n_non_leap else 0
          print('\n=== UNIFORMITY (Gregorian month-day, excluding Feb 29) ===')
          print(f'n used for chi-square: {n_non_leap} (Feb 29 count={feb29})')
          print(f'Chi-square statistic (365 bins): {chi2:.2f}')
          print(f'Approx z-score vs df=364: {z:.2f}')
          print(f'(z>|2| suggests mild non-uniformity; |z|>3 stronger)')

          # Month distribution
          month_counts = collections.Counter(m for m, d in greg_md)
          print('\n=== BY MONTH ===')
          for m in range(1, 13):
              print(f'  month {m:02d}: {month_counts.get(m, 0)}')

          # Top shared days
          print('\n=== TOP SHARED CALENDAR DAYS ===')
          top = sorted(multi.items(), key=lambda x: (-x[1], x[0]))[:25]
          for (mon, day), cnt in top:
              people = names_by_md[(mon, day)][:8]
              extra = '' if cnt <= 8 else f' ... +{cnt-8} more'
              print(f'  {day:02d}/{mon:02d}: {cnt} people — {" | ".join(people)}{extra}')

          # Expected max load (approximation)
          # E[max] roughly log(n)/log(d/n) style; simple simulation bound:
          # For balls and bins, E[max] ≈ log(n)/log(d/n) when n>>d, else ~ 3 for n~sqrt(d)
          lam = n / 365.0
          # rough: max typically around 3 * log(d)/log(log(d)) for n=d; use Poisson quantile
          print('\n=== LOAD (people per day) ===')
          load_hist = collections.Counter(counts.values())
          for k in sorted(load_hist):
              print(f'  days with exactly {k} person(s): {load_hist[k]}')

          # Probability of observing shared_pairs under uniform (approx Poisson)
          exp_pairs = expected_shared_pairs(n)
          # ratio
          ratio = shared_pairs / exp_pairs if exp_pairs else float('inf')
          print('\n=== SUMMARY RATIOS ===')
          print(f'observed_pairs / expected_pairs = {ratio:.3f}')
          print(f'observed_collision_days / expected_collision_days = {days_with_2plus / expected_collision_days(n) if expected_collision_days(n) else 0:.3f}')

          # Same full date (same year) — identical birthdays including year (twins / data dup)
          full_counts = collections.Counter(greg_full)
          same_full = {k: v for k, v in full_counts.items() if v >= 2}
          print('\n=== SAME FULL DATE (year+month+day) — possible twins / duplicates ===')
          print(f'Number of distinct full dates with 2+ people: {len(same_full)}')
          for (y, m, d), cnt in sorted(same_full.items(), key=lambda x: -x[1])[:20]:
              print(f'  {d:02d}/{m:02d}/{y}: {cnt}')

          print('\n=== DONE ===')
          PY
