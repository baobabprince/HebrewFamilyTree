name: Birthday Paradox Analysis

on:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write Google token
        run: echo '${{ secrets.GOOGLE_TOKEN_JSON }}' > token.json

      - name: Write service credentials
        run: |
          echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > sa.json

      - name: Analyze Hebrew birthdays
        env:
          GOOGLE_APPLICATION_CREDENTIALS: sa.json
        run: |
          python3 << 'PY'
          import math, collections
          from family_tree_notifier.google_drive_utils import download_gedcom_from_drive
          from family_tree_notifier.gedcom_utils import fix_gedcom_format, process_gedcom_file
          from family_tree_notifier.constants import (
              GOOGLE_DRIVE_FILE_ID, INPUT_GEDCOM_FILE, FIXED_GEDCOM_FILE, OUTPUT_CSV_FILE,
              HEBREW_MONTH_NAMES_FULL,
          )
          from gedcom.parser import Parser

          assert download_gedcom_from_drive(GOOGLE_DRIVE_FILE_ID, INPUT_GEDCOM_FILE)
          fix_gedcom_format(INPUT_GEDCOM_FILE, FIXED_GEDCOM_FILE)

          # processed rows: from process_gedcom_file / dates list
          # process_gedcom_file returns (processed_rows, individual_details, family_details)
          rows, individual_details, family_details = process_gedcom_file(
              FIXED_GEDCOM_FILE, OUTPUT_CSV_FILE, lang='he'
          )

          # Count individuals
          parser = Parser()
          parser.parse_file(FIXED_GEDCOM_FILE)
          n_indi = sum(1 for p, e in parser.get_element_dictionary().items()
                       if p.startswith('@') and e.get_tag() == 'INDI')

          # Extract BIRT only: rows structure from process - check by printing sample
          # dates append: (month_num, day, hebrew_date_formatted, label, individual_id, husband_id, wife_id)
          # processed_rows may be different - read dates.csv or use process output

          # Re-walk via process_event data: use dates collected by scanning CSV
          import csv
          birt = []  # (month_num, day, name, id)
          with open(OUTPUT_CSV_FILE, newline='', encoding='utf-8') as f:
              reader = csv.reader(f)
              header = next(reader, None)
              print('CSV header:', header)
              for row in reader:
                  print('SAMPLE_ROW', row)
                  break

          # Prefer parsing FIXED_GEDCOM with same logic as process_event for BIRT only
          from family_tree_notifier.gedcom_utils import process_event, get_name_from_individual

          names_map = {}
          for p, e in parser.get_element_dictionary().items():
              if e.get_tag() == 'INDI':
                  names_map[p] = get_name_from_individual(e, lang='he')

          dates = []
          for p, e in parser.get_element_dictionary().items():
              if e.get_tag() != 'INDI':
                  continue
              name = names_map.get(p, p)
              for child in e.get_child_elements():
                  if child.get_tag() == 'BIRT':
                      process_event(child, name, dates, event_type='BIRT', individual_id=p)

          # dates: (month_num, day, heb_str, label, id, h, w)
          heb_md = []
          names_by = collections.defaultdict(list)
          for item in dates:
              month_num, day = item[0], item[1]
              name = item[3].split(' - ')[0] if isinstance(item[3], str) else names_map.get(item[4], '?')
              # label format "name - BIRT: heb"
              if isinstance(item[3], str) and ' - ' in item[3]:
                  name = item[3].split(' - ')[0]
              heb_md.append((month_num, day))
              names_by[(month_num, day)].append(name)

          n = len(heb_md)
          print('=== DATA COVERAGE ===')
          print(f'Total individuals in GEDCOM: {n_indi}')
          print(f'Hebrew BIRT events with parseable month+day: {n}')
          print(f'Unique people in individual_details: {len(individual_details)}')

          def p_at_least_one_shared(n, d):
              if n <= 1:
                  return 0.0
              if n > d:
                  return 1.0
              log_p = 0.0
              for i in range(n):
                  log_p += math.log(d - i) - math.log(d)
              return 1.0 - math.exp(log_p)

          def expected_shared_pairs(n, d):
              return math.comb(n, 2) / d if n >= 2 else 0.0

          def expected_collision_days(n, d):
              lam = n / d
              return d * (1 - math.exp(-lam) * (1 + lam))

          counts = collections.Counter(heb_md)
          multi = {k: v for k, v in counts.items() if v >= 2}
          shared_pairs = sum(math.comb(v, 2) for v in counts.values() if v >= 2)
          days_2 = len(multi)
          days_3 = sum(1 for v in counts.values() if v >= 3)
          days_4 = sum(1 for v in counts.values() if v >= 4)
          max_share = max(counts.values()) if counts else 0

          # Hebrew year length approx: 354 common, 384 with Adar I slots rarely used
          # Use three reference d values
          for d_label, d in [('Hebrew~354 (common year)', 354), ('Gregorian-like 365', 365), ('Hebrew slots incl Adar I ~384', 384)]:
              print(f'\n=== BIRTHDAY PARADOX ({d_label}) ===')
              print(f'n = {n}')
              print(f'P(at least one shared | uniform d={d}) = {p_at_least_one_shared(n, d):.6f}')
              print(f'Expected shared pairs = {expected_shared_pairs(n, d):.2f}')
              print(f'Expected days with 2+ = {expected_collision_days(n, d):.2f}')

          print(f'\n=== OBSERVED ===')
          print(f'At least one shared Hebrew birthday: {days_2 > 0}')
          print(f'Shared pairs: {shared_pairs}')
          print(f'Days with 2+: {days_2}')
          print(f'Days with 3+: {days_3}')
          print(f'Days with 4+: {days_4}')
          print(f'Max on one Hebrew day-month: {max_share}')
          print(f'Occupied distinct Hebrew day-months: {len(counts)}')

          exp354 = expected_shared_pairs(n, 354)
          exp_days354 = expected_collision_days(n, 354)
          print(f'\n=== RATIOS vs uniform d=354 ===')
          print(f'pairs obs/exp = {shared_pairs / exp354 if exp354 else 0:.3f}')
          print(f'collision-days obs/exp = {days_2 / exp_days354 if exp_days354 else 0:.3f}')

          # Month distribution (Hebrew month numbers)
          month_counts = collections.Counter(m for m, d in heb_md)
          print('\n=== BY HEBREW MONTH ===')
          for m in sorted(month_counts.keys()):
              label = HEBREW_MONTH_NAMES_FULL.get(m, str(m))
              print(f'  {label} ({m}): {month_counts[m]}')

          print('\n=== TOP SHARED HEBREW BIRTHDAYS ===')
          top = sorted(multi.items(), key=lambda x: (-x[1], x[0]))[:30]
          for (mon, day), cnt in top:
              label = HEBREW_MONTH_NAMES_FULL.get(mon, str(mon))
              people = names_by[(mon, day)][:10]
              extra = '' if cnt <= 10 else f' ... +{cnt-10}'
              print(f'  {day} {label}: {cnt} — {" | ".join(people)}{extra}')

          print('\n=== LOAD HISTOGRAM ===')
          load = collections.Counter(counts.values())
          for k in sorted(load):
              print(f'  days with exactly {k}: {load[k]}')

          # Chi-square over occupied-month space: use all (month,day) that are valid
          # Approximate: bins = observed key space expanded to day 1-30 for months 1-12,61,62
          valid_keys = []
          for m in list(range(1, 13)) + [61, 62]:
              for day in range(1, 31):
                  valid_keys.append((m, day))
          d_bins = len(valid_keys)
          bin_count = {k: counts.get(k, 0) for k in valid_keys}
          n_chi = sum(bin_count.values())
          exp = n_chi / d_bins if d_bins else 0
          chi2 = sum((c - exp) ** 2 / exp for c in bin_count.values()) if exp else 0
          df = d_bins - 1
          z = (chi2 - df) / math.sqrt(2 * df) if df else 0
          print(f'\n=== UNIFORMITY chi-square over {d_bins} Hebrew day-month slots ===')
          print(f'chi2={chi2:.1f} df={df} approx_z={z:.2f}')

          print('\n=== DONE ===')
          PY
